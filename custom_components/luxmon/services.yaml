quick_charge_start:
  name: Quick charge start
  description: Start a timed AC quick charge on the inverter.
  fields:
    amps:
      name: Amps
      description: Target AC charge current in amps. Uses lux-mon default if omitted.
      example: 85
      selector:
        number:
          min: 0
          max: 185
          unit_of_measurement: A
    minutes:
      name: Minutes
      description: Duration in minutes. Uses lux-mon default if omitted.
      example: 60
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: min

quick_charge_stop:
  name: Quick charge stop
  description: Stop an active quick charge and restore the previous AC charge current.

set_setting:
  name: Set lux-mon setting
  description: Write a value to any lux-mon runtime setting.
  fields:
    name:
      name: Setting name
      description: lux-mon setting key, e.g. output_source_priority.
      example: output_source_priority
      required: true
      selector:
        text:
    value:
      name: Value
      description: New setting value (string, number, or boolean).
      example: sbu
      required: true
      selector:
        text:

load_automation_rules:
  name: Load automation rules
  description: Replace the full lux-mon automation rule set.
  fields:
    rules:
      name: Rules
      description: JSON array of automation rule objects.
      example: '[{"type": "rule_table", "target": "ac_charge_battery_current", "rows": []}]'
      required: true
      selector:
        object:
    enabled:
      name: Enabled
      description: Enable the automation engine after loading rules.
      example: true
      default: true
      selector:
        boolean:
